services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pca}
      POSTGRES_USER: ${POSTGRES_USER:-pca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: pca-acailandia:local
    build:
      context: .
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pca}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-pca}?schema=public
      API_PORT: "3001"
      NODE_ENV: production
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/saude').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pg_dados:
